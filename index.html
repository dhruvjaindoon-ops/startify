<!DOCTYPE html>
<html>
<head>
  <title>Startify AI</title>
  <link rel="stylesheet" href="style.css">

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@2/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("YOUR_PUBLIC_KEY"); // 🔑 yaha apni Public Key daal
    })();
  </script>
</head>

<body>

<h1>🚀 Startify AI</h1>

<!-- 🔐 Registration -->
<div class="box">
  <h2>Register</h2>
  <input id="email" placeholder="Enter Email"><br><br>
  <button onclick="sendOTP()">Send OTP</button><br><br>

  <input id="otpInput" placeholder="Enter OTP"><br><br>
  <button onclick="verifyOTP()">Verify</button>

  <p id="otpMsg"></p>
</div>

<hr>

<!-- 🤖 AI SECTION -->
<div class="box">
  <input id="userInput" placeholder="Enter any career or business">
  <button onclick="generatePlan()">Generate</button>
</div>

<div id="output"></div>

<script src="script.js"></script>
</body>
</html>
